<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raffle Draw</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <header>
      <h1 class="text-center mt-1">Raffle Draw Application</h1>
      <p class="text-center">
        Note: First input the names and then press Enter. After that, the input
        field is become empty, to see the list Please Click the "Show All Names"
        Button
      </p>
    </header>
    <main>
      <div class="row firsthalf">
        <div class="col-md-6">
          <div class="form-group">
            <label class="mb-1">Enter Participants Names</label>
            <textarea
              class="form-control"
              id="nameInput"
              rows="8"
              placeholder="Enter names separated by commas and space(Ex: Emad, Adil, Jamil)"
            ></textarea>
          </div>

          <div class="form-group mt-3">
            <label class="mb-1" for="winnerCount">Number of Winners</label>
            <input
              type="number"
              class="form-control"
              id="winnerCount"
              min="1"
              max="20"
              value="3"
              style="width: 120px;"
            />
          </div>

          <div>
            <button
              class="btn btn-primary mt-2"
              type="button"
              id="toggleNamesBtn"
              data-bs-toggle="collapse"
              data-bs-target="#collapseExample"
              aria-expanded="false"
              aria-controls="collapseExample"
            >
              Show All Names
            </button>

            <div class="collapse my-4" id="collapseExample">
              <div class="card card-body">
                <ul class="list-group" id="nameList"></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 giveATry">
          <h5>Output Display</h5>
          <div class="form-group">
            <input
              type="text"
              class="form-control"
              id="outputDisplay"
              placeholder="Display"
              readonly
            />
          </div>

          <div class="d-flex flex-wrap justify-content-center gap-2 mt-2">
            <button class="btn btn-success" id="giveATry">Give A Try</button>
            <button class="btn btn-primary" id="resetBtn">New Round</button>
          </div>

          <div class="mt-5 winnerNameList">
            <div id="winnerList"></div>
          </div>

          <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
            <button class="btn btn-secondary" id="copyWinnersBtn">Copy Winners</button>
            <button class="btn btn-secondary" id="downloadWinnersBtn">Download as TXT</button>
          </div>
        </div>
      </div>
    </main>
    <footer class="mt-2">
      <hr />
      <h4 class="text-center mt-2">
        Special Thanks to Stack Learner and HM Nayeem
      </h4>
      <a
        class="link"
        href="https://emadaa.github.io/Emad-Uddin-Adil/"
        target="_blank"
      ><h3 class="text-center mt-2">Emad Uddin Adil</h3></a>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
